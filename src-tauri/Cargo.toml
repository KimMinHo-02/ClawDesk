[package]
name = "clawdesk"
version = "0.0.0"
description = "ClawDesk - OpenClaw desktop manager (Phase 0 scaffold)"
authors = ["ClawDesk"]
edition = "2021"
default-run = "clawdesk"

[lib]
name = "clawdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clawdesk-fake-openclaw"
path = "fixtures/fake-openclaw/main.rs"

[[bin]]
name = "clawdesk-fake-npm"
path = "fixtures/fake-npm/main.rs"

[[bin]]
name = "clawdesk-fake-winget"
path = "fixtures/fake-winget/main.rs"

[[bin]]
name = "clawdesk-fake-node"
path = "fixtures/fake-node/main.rs"

[[bin]]
name = "clawdesk-secret-resolver"
path = "resolver/main.rs"

[features]
# Dedicated real-OpenClaw E2E gate (S9). Real mutation only happens when this
# feature, the `--test real_e2e` target, and CLAWDESK_REAL_E2E=1 all hold.
real-e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_SystemInformation",
] }
